  "@milaboratories/ts-builder": 1.8.0
  "@milaboratories/ts-configs": 1.4.1
  "@platforma-sdk/workflow-tengo": 6.22.2
  "@platforma-sdk/model": 1.89.0
  "@platforma-sdk/ui-vue": 1.89.0
  "@platforma-sdk/tengo-builder": 4.1.21
  "@platforma-sdk/package-builder": 3.17.0
  "@platforma-sdk/block-kind": 1.1.1
  "@platforma-sdk/block-tools": 2.19.1
  "@platforma-sdk/test": 1.89.0
  "@milaboratories/helpers": 1.14.7
  "@milaboratories/graph-maker": 1.10.1
  "@milaboratories/multi-sequence-alignment": 1.47.30
  "@milaboratories/strings": 0.1.2
  # pinned to the copy already in the graph, so the kind does not pull a second one
  "es-toolkit": 1.43.0

  "@milaboratories/software-pframes-conv": 2.2.9
  "@platforma-open/milaboratories.runenv-python-3": 1.15.1

